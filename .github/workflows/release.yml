name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-native:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            full: false
          - os: macos-latest
            rid: osx-arm64
            full: false
          - os: ubuntu-latest
            rid: linux-x64
            full: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install cmake (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install cmake

      - name: Install native deps (Linux full)
        if: matrix.full
        run: sudo apt-get update && sudo apt-get install -y libompl-dev libfcl-dev libboost-serialization-dev cmake g++

      - name: Build native stub
        if: ${{ !matrix.full }}
        shell: bash
        run: ./scripts/build-native-stub.sh ${{ matrix.rid }}

      - name: Build native full (Linux)
        if: matrix.full
        shell: bash
        run: bash ./scripts/build-native-full.sh ${{ matrix.rid }}

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: motus-native-${{ matrix.rid }}
          path: src/Motus.Native/runtimes/${{ matrix.rid }}/native/

  release:
    needs: build-native
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Download native stubs
        uses: actions/download-artifact@v4
        with:
          pattern: motus-native-*
          path: stubs

      - name: Merge stubs into package
        run: |
          mkdir -p src/Motus.Native/runtimes
          for d in stubs/motus-native-*; do
            [ -d "$d" ] || continue
            rid="${d##*motus-native-}"
            mkdir -p "src/Motus.Native/runtimes/$rid/native"
            cp -r "$d/"* "src/Motus.Native/runtimes/$rid/native/"
          done
          ls -R src/Motus.Native/runtimes || true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Resolve version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Motus.NET.slnx

      - name: Build
        run: dotnet build Motus.NET.slnx -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install urdf-loader tools
        run: npm ci
        working-directory: tools/urdf-viewer

      - name: Test
        run: dotnet test Motus.NET.slnx -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack Motus.NET.slnx -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts

      - name: Extract release notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          perl -0ne "print \$1 if /## \[$VERSION\][^\n]*\n(.*?)(?=\n## \[|\z)/s" CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section for $VERSION" >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" artifacts/*.nupkg artifacts/*.snupkg --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "Motus.NET ${{ steps.version.outputs.version }}" \
              --notes-file release-notes.md \
              artifacts/*.nupkg artifacts/*.snupkg
          fi

      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: lasaths

      - name: Push to NuGet
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push artifacts/*.snupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
