name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Motus.NET.slnx

      - name: Build native stub
        shell: bash
        run: ./scripts/build-native-stub.sh

      - name: Build
        run: dotnet build Motus.NET.slnx -c Release --no-restore

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install urdf-loader tools
        run: npm ci
        working-directory: tools/urdf-viewer

      - name: Test
        run: dotnet test Motus.NET.slnx -c Release --no-build --verbosity normal

  native-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install native deps
        run: sudo apt-get update && sudo apt-get install -y libompl-dev libfcl-dev libboost-serialization-dev cmake g++

      - name: Build motus_native
        working-directory: native
        run: |
          cmake -B build -DMOTUS_USE_OMPL=ON -DMOTUS_USE_FCL=ON
          cmake --build build --config Release

      - name: Verify native library
        working-directory: native/build
        run: |
          test -f libmotus_native.so
          nm -D libmotus_native.so | grep motus_ompl_is_available
          nm -D libmotus_native.so | grep motus_fcl_is_available

      - name: Install full native into package layout
        run: |
          mkdir -p src/Motus.Native/runtimes/linux-x64/native
          cp native/build/libmotus_native.so src/Motus.Native/runtimes/linux-x64/native/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install urdf-loader tools
        run: npm ci
        working-directory: tools/urdf-viewer

      - name: Test with full native
        env:
          MOTUS_NATIVE_FULL: "1"
        run: |
          dotnet build Motus.NET.slnx -c Release
          dotnet test tests/Motus.Presets.Tests/Motus.Presets.Tests.csproj -c Release --no-build --verbosity normal --settings build/native-integration.runsettings
          dotnet test tests/Motus.OMPL.Tests/Motus.OMPL.Tests.csproj -c Release --no-build --verbosity normal --settings build/native-integration.runsettings
          dotnet test tests/Motus.Core.Tests/Motus.Core.Tests.csproj -c Release --no-build --verbosity normal --settings build/native-integration.runsettings
