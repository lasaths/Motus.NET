<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Motus.NET Bamboo Viewer</title>
    <base href="/" />
    <link rel="stylesheet" href="css/andura/andura.css" />
    <link rel="stylesheet" href="css/andura/andura-fonts.css" />
    <link rel="stylesheet" href="css/viewer.css" />
    <script>/* ANDURA contract: ?scale= follows OS text size (text-scale.*) */
        (function () { var s = parseFloat(new URLSearchParams(location.search).get('scale')); if (s > 0) document.documentElement.style.setProperty('--s', s); })();</script>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Motus.Viewer.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div class="app-loading label">Loading Motus.NET…</div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">✕</span>
    </div>
    <!-- Three.js r128 vendored; OrbitControls unused (custom orbit matches HTML preview). -->
    <script src="lib/three/three.min.js"></script>
    <script src="js/viewer.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
